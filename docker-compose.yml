services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: winfotest_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql+psycopg2://postgres:pgadmin@host.docker.internal:5432/postgres
      - DATABASE_SCHEMA=public
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=20
      - DB_POOL_TIMEOUT=30.0
      - DB_POOL_RECYCLE=1800
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=winfotest_semantic_scripts
      - EMBEDDING_MODEL_NAME=nomic-embed-text
      - EMBEDDING_DIMENSION=768
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_API_KEY=${LLM_API_KEY:-mock-ollama-key}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5-coder:7b}
      - FAST_LLM_MODEL=${FAST_LLM_MODEL:-qwen2.5-coder:1.5b}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
      - LLM_TIMEOUT_SECONDS=600.0
    depends_on:
      qdrant:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: winfotest_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_data:
